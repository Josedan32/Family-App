name: Auto PR developer -> main

permissions:
  contents: write
  pull-requests: write

on:
  workflow_run:
    workflows: ["CI"]
    branches: [developer]
    types: [completed]

jobs:
  pull-request:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: developer

      - name: Create pull request to main
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --base main --head developer \
            --title "chore: merge developer into main" \
            --body "Automatically opened once CI passed on developer." \
            || echo "A pull request from developer to main is already open."
