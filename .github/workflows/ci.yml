name: CI

on:
  pull_request:
    branches: [main, developer]
  push:
    branches: [developer, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

defaults:
  run:
    working-directory: apps/api

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: mypy --strict
        run: mypy src

  test:
    name: Test (pytest + PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: family
          POSTGRES_PASSWORD: family
          POSTGRES_DB: family_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://family:family@localhost:5432/family_test
      TEST_DATABASE_URL: postgresql+asyncpg://family:family@localhost:5432/family_test
      JWT_SECRET: ci-only-secret-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run migrations
        run: alembic upgrade head

      - name: Verify migrations reverse cleanly
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: pytest
        run: pytest -v

  web:
    name: Web (vitest + tsc + eslint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build

  docker:
    name: API image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image is what actually gets deployed. A Dockerfile that only breaks
      # at deploy time breaks in front of the family.
      - name: Build
        run: docker build -t family-api:ci apps/api
